# Release workflow: build the combined native library, assemble signed
# per-ABI release APKs, and publish them as a GitHub Release so users
# can sideload straight from the Releases page (mirrors ant's
# release.yml shape: tag push → build → release + SHA256SUMS).
#
# Trigger: push a tag like `v0.4.0`, or run manually via the Actions
# tab (workflow_dispatch) for a dry run that builds without publishing.
#
# Jobs (#309): `ffi` builds libfreedom_mobile_ffi.so, one matrix job per
# ABI, `colibri` builds libc4.so and `unit-tests` runs the JVM tests and
# the localisation lint (#280), all in parallel; `apk` packages the two
# libraries as soon as they're there, alongside the tests, into
# unsigned APKs that `sign` signs; `licences` checks the open-source
# licence lists against FFI_REF and COLIBRI_REF (#325); `publish` needs
# `sign`, `unit-tests` and `licences`, so nothing is released unless the tests, lint and licence lists passed. The two native libraries are cached with
# actions/cache, keyed on everything that shapes them (see each job's
# "Cache key" step), and a hit skips their build entirely; the checks
# after the build run on a hit too (scripts/check-native-libs.sh, and
# the Radicle bindings compared with the generated copy cached alongside
# the library), so a stale or wrong artefact still fails the job. A
# cache miss builds as before, the two ABIs side by side, and caches the
# result once the library check passes. The bindings comparison runs
# after the save, so a FFI_REF bump that needs regenerated bindings
# still caches its (correct) library and generated bindings: the commit
# that updates the committed copy then hits the cache instead of
# rebuilding. The matrix doesn't fail fast either, so that failure in
# the arm64 job doesn't cancel x86_64's build before it's cached.
#
# Why actions/cache rather than publishing the .so files as assets on
# the freedom-mobile-ffi release: that needs a token with write access to
# the other repo, and the assets would have to be keyed on this repo's
# own build recipe (features, fat LTO) anyway, which isn't that repo's
# business. The catch with actions/cache is its scoping: a run can only
# restore caches saved on its own ref or on main, so a cache saved by a
# tag run is never seen by the next tag. So the cache is filled from
# main: a push to main that touches the build recipe (an FFI_REF or
# COLIBRI_REF bump, one of the build scripts) runs just `ffi` and
# `colibri`, and so does a twice-weekly schedule, which also keeps the
# entries from being evicted (GitHub drops caches unused for 7 days). A
# release that still misses (evicted, or tagged within minutes of the
# bump) just builds from source: about 25 min instead of about 8 (measured
# on the #309 dry runs; the old single-job workflow took about 40).
# There's no Rust build cache (Swatinem/rust-cache) any more: its ~1 GB
# target dir per ABI, saved on a tag's own ref, could never be restored by
# a later tag, and it would crowd the finished libraries out of the
# repo's 10 GB cache budget.
#
# Secrets: KEYSTORE_BASE64 (the release keystore, base64),
# KEYSTORE_PASSWORD, KEY_ALIAS. APKs are signed with this one key
# forever — Android ties updates to the signing certificate, so the
# keystore must never be rotated casually. So it stays away from
# third-party code (#469): only the `sign` job sees it, and that job runs
# no Gradle and no third-party action. Every action here is pinned to a
# full commit SHA (Dependabot proposes the bumps, .github/dependabot.yml),
# Gradle checks every dependency against gradle/verification-metadata.xml
# and the wrapper's distribution against distributionSha256Sum, and the
# release is published with the runner's own gh.
#
# FFI_REF pins which freedom-mobile-ffi tag supplies the embedded
# nodes; bump it together with the vendored headers in
# swarmnode/src/main/cpp/ (see README § Building libfreedom_mobile_ffi.so).
# It must be a tag whose Cargo.toml pins its node deps by tag, and the
# README's clone lines must use it too: scripts/check-ffi-ref.sh enforces
# that here (this workflow refuses to build otherwise) and reports it on
# every PR (ffi-ref.yml — a status check only, since main has no branch
# protection).
# The library is built with ant's `chain` feature, the Radicle node and
# the Tor client, and with fat LTO (see the build step).
#
# COLIBRI_REF pins the corpus-core/colibri-stateless tag libc4.so (the
# Colibri verifier behind proven name resolution, #100) is built from;
# bump it with the vendored swarmnode/src/main/cpp/colibri.h. A local
# build without libc4.so still works (names start at the RPC quorum), so
# this workflow checks every APK carries it.

name: release

on:
  push:
    tags: ["v*"]
    # Fill the cache on main (see above). Only `ffi` and `colibri` run.
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/build-ffi.sh
      - scripts/enable-ffi-*.sh
      - scripts/build-colibri.sh
      - scripts/generate-radicle-bindings.sh
      - scripts/check-native-libs.sh
      # A bindings-only fix after a stale-bindings failure: re-run the
      # check (a cache hit by then) so main goes green again.
      - swarmnode/src/main/java/uniffi/libradicle_uniffi/libradicle_uniffi.kt
  schedule:
    - cron: "23 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

env:
  FFI_REF: v0.12.14
  COLIBRI_REF: v3.0.0
  # Pinned (not "latest") so it can be part of the ffi cache key.
  CARGO_NDK_VERSION: 4.1.2

jobs:
  ffi:
    name: libfreedom_mobile_ffi.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      # One ABI's failure must not cancel the other mid-build: each
      # caches its own library (see above).
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: FFI_REF is a tagged freedom-mobile-ffi release
        run: scripts/check-ffi-ref.sh

      - name: Checkout freedom-mobile-ffi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: solardev-xyz/freedom-mobile-ffi
          ref: ${{ env.FFI_REF }}
          path: freedom-mobile-ffi

      # The library is a function of FFI_REF (sources, Cargo.lock,
      # build-android.sh and the rust-toolchain.toml channel), of this
      # repo's build recipe (scripts/build-ffi.sh and the enable-ffi-*.sh
      # helpers it runs; the bindings generator for the cached bindings),
      # and of the tools: the exact rustc the channel resolves to today,
      # the runner's NDK and cargo-ndk. All of them go into the key.
      - name: Cache key
        id: key
        working-directory: freedom-mobile-ffi
        run: |
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --no-self-update \
            --target aarch64-linux-android --target x86_64-linux-android
          rustc="$(rustc +"$channel" --version)"
          ndk="$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_ROOT/source.properties")"
          echo "rustc: $rustc; NDK: $ndk; cargo-ndk: $CARGO_NDK_VERSION"
          tools="$(printf '%s|%s|%s' "$rustc" "$ndk" "$CARGO_NDK_VERSION" | sha256sum | cut -c1-16)"
          echo "key=ffi-v1-${{ matrix.abi }}-$FFI_REF-$tools-${{ hashFiles('scripts/build-ffi.sh', 'scripts/enable-ffi-*.sh', 'scripts/generate-radicle-bindings.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built library
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: native-out
          key: ${{ steps.key.outputs.key }}

      # The ffi crate pins its node deps as ssh:// git URLs (local-dev
      # convenience); all repos are public, so fetch them over https.
      - name: Rewrite ssh git deps to https
        if: steps.cache.outputs.cache-hit != 'true'
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install cargo-ndk
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build libfreedom_mobile_ffi.so (${{ matrix.abi }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # ANDROID_NDK_ROOT is the runner image's default NDK (r27.x),
          # matching the locally-verified toolchain; LATEST_HOME floats.
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          # ant's `chain` feature (on-chain /wallet, /stamps, /chequebook
          # gateway surfaces), the Radicle node, the Arti client for
          # .onion (#143) and fat LTO (#230): see scripts/build-ffi.sh and
          # the enable-ffi-*.sh helpers it runs, the same ones the README's
          # local build uses. They fail the job if build-android.sh ever
          # changes shape under a new FFI_REF.
          scripts/build-ffi.sh freedom-mobile-ffi ${{ matrix.abi }}
          mkdir -p native-out
          cp -r freedom-mobile-ffi/target/android/. native-out/

      # The committed Kotlin bindings must match the Radicle surface this
      # .so was built with (they checksum every call at load). The
      # generator reads the aarch64 rlib, so the arm64 job makes them, and
      # they're cached with its library.
      - name: Generate the Radicle UniFFI bindings
        if: steps.cache.outputs.cache-hit != 'true' && matrix.abi == 'arm64-v8a'
        run: scripts/generate-radicle-bindings.sh freedom-mobile-ffi --emit native-out/radicle/libradicle_uniffi.kt

      # From here on, a cache hit is checked like a fresh build.
      - name: Check the library
        run: scripts/check-native-libs.sh native-out/jniLibs ${{ matrix.abi }}

      # Only a library that passed its check is cached. Before the
      # bindings check, on purpose: stale committed bindings are a fault
      # of this repo, not of the build, and a hit re-runs that check.
      - name: Cache the built library
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: native-out
          key: ${{ steps.key.outputs.key }}

      - name: Check the Radicle UniFFI bindings are current
        if: matrix.abi == 'arm64-v8a'
        run: |
          committed=swarmnode/src/main/java/uniffi/libradicle_uniffi/libradicle_uniffi.kt
          generated=native-out/radicle/libradicle_uniffi.kt
          [ -f "$generated" ] || { echo "::error::no generated bindings in the build output"; exit 1; }
          if ! cmp -s "$generated" "$committed"; then
            echo "::error::$committed is stale for this build; rerun scripts/generate-radicle-bindings.sh and commit it"
            diff -u "$committed" "$generated" | head -40 || true
            exit 1
          fi
          echo "committed bindings match the build"

      - name: Upload the library
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ffi-${{ matrix.abi }}
          path: native-out/jniLibs/
          if-no-files-found: error
          # Long enough to "Re-run failed jobs" of apk/publish a week or so
          # later without rebuilding: a re-run downloads this artifact
          # from the original run.
          retention-days: 14

      - name: Upload native diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jniLibs-debug-${{ matrix.abi }}
          path: freedom-mobile-ffi/target/android/
          if-no-files-found: ignore

  colibri:
    name: libc4.so
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # libc4.so is a function of COLIBRI_REF (whose CMake pins the
      # evmone, intx and blst it fetches), scripts/build-colibri.sh, and
      # the runner's NDK, CMake and Ninja.
      - name: Cache key
        id: key
        run: |
          ndk="$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_ROOT/source.properties")"
          tools="NDK $ndk; $(cmake --version | head -1); ninja $(ninja --version)"
          echo "$tools"
          echo "key=colibri-v1-$COLIBRI_REF-$(printf '%s' "$tools" | sha256sum | cut -c1-16)-${{ hashFiles('scripts/build-colibri.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built library
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: colibri-out
          key: ${{ steps.key.outputs.key }}

      - name: Checkout colibri-stateless
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: corpus-core/colibri-stateless
          ref: ${{ env.COLIBRI_REF }}
          path: colibri-stateless
          fetch-depth: 0

      - name: Build libc4.so (arm64-v8a + x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          C4_VERSION="${COLIBRI_REF#v}" scripts/build-colibri.sh colibri-stateless colibri-out

      - name: Check the library
        run: scripts/check-native-libs.sh colibri-out arm64-v8a x86_64 --colibri

      - name: Cache the built library
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: colibri-out
          key: ${{ steps.key.outputs.key }}

      - name: Upload the library
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: colibri
          path: colibri-out/
          if-no-files-found: error
          # Long enough to "Re-run failed jobs" of apk/publish a week or so
          # later without rebuilding: a re-run downloads this artifact
          # from the original run.
          retention-days: 14

  # Open-source licences (#325): app/licences/native.json lists every crate
  # in libfreedom_mobile_ffi.so at FFI_REF, and bundled.json what libc4.so
  # links at COLIBRI_REF. The Gradle build checks the pins offline; this
  # regenerates the crate list and reads Colibri's own pins, so a list
  # that's stale for the current refs fails here. See app/licences/README.md.
  licences:
    name: open-source licences
    # Not on the cache-filling runs; ffi-ref.yml runs it on every PR and
    # push to main.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pins
        id: pins
        run: |
          echo "ffi=$(sed -n 's/^  FFI_REF: *//p' .github/workflows/release.yml)" >> "$GITHUB_OUTPUT"
          echo "colibri=$(sed -n 's/^  COLIBRI_REF: *//p' .github/workflows/release.yml)" >> "$GITHUB_OUTPUT"

      - name: Checkout freedom-mobile-ffi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: solardev-xyz/freedom-mobile-ffi
          ref: ${{ steps.pins.outputs.ffi }}
          path: freedom-mobile-ffi
          fetch-depth: 0

      - name: Checkout colibri-stateless
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: corpus-core/colibri-stateless
          ref: ${{ steps.pins.outputs.colibri }}
          path: colibri-stateless
          fetch-depth: 0

      # The pinned release binary (scripts/native-licences.sh checks the
      # version), checked against the hash published with it.
      - name: Install cargo-about
        run: |
          v=0.9.2
          f="cargo-about-$v-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/$f.tar.gz" "https://github.com/EmbarkStudios/cargo-about/releases/download/$v/$f.tar.gz"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$f" >> "$GITHUB_PATH"

      # As in release.yml's ffi job: the ffi crate's node deps are ssh://
      # git URLs, all public, fetched over https; and the toolchain its
      # rust-toolchain.toml names.
      - name: Rust toolchain and git deps over https
        working-directory: freedom-mobile-ffi
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --no-self-update

      - name: The native crate list is current
        run: scripts/native-licences.sh freedom-mobile-ffi --check

      - name: The Colibri list is current
        if: ${{ !cancelled() }}
        run: scripts/check-colibri-licences.sh colibri-stateless

  unit-tests:
    # Not on the cache-filling runs (push to main, schedule).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # JVM tests only: nothing here needs the native libraries.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # The localisation gate (#280): the HardcodedUiText check's own
      # tests, then lint with it (what it checks: `lint {}` in
      # app/build.gradle.kts). Run even when a unit test failed, so one
      # run reports both. Lint bundles :swarmnode as an AAR, which would
      # build its JNI shim, and that links against libfreedom_mobile_ffi.so,
      # which this job doesn't have; lint doesn't need the shim, so skip it.
      - name: Lint (hardcoded UI text)
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew --no-daemon :lint-checks:test :app:lintDebug
          -x ':swarmnode:buildCMakeDebug[arm64-v8a]'
          -x ':swarmnode:buildCMakeDebug[x86_64]'

      # The build log has each failure's message and stack trace
      # (app/build.gradle.kts testLogging); the reports have every test's
      # output too (#310). The lint report lists every finding.
      - name: Upload unit test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            lint-checks/build/reports/tests/test/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  apk:
    needs: [ffi, colibri]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download libfreedom_mobile_ffi.so
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ffi-*
          path: swarmnode/src/main/jniLibs
          merge-multiple: true

      - name: Download libc4.so
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: colibri
          path: swarmnode/src/main/jniLibs

      # Same checks as the jobs that made them, on the combined tree the
      # APKs are built from.
      - name: Check the native libraries
        run: |
          scripts/check-native-libs.sh swarmnode/src/main/jniLibs arm64-v8a x86_64
          scripts/check-native-libs.sh swarmnode/src/main/jniLibs arm64-v8a x86_64 --colibri

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Read-only: a release run never writes the Gradle cache, and
      # every dependency Gradle resolves, cached or not, is checked
      # against gradle/verification-metadata.xml (#469).
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      # Unsigned: this job runs Gradle, its plugins and dependencies and
      # setup-gradle's init scripts and post-step, so it never sees the
      # keystore. The `sign` job below signs the APKs (#469).
      - name: Assemble unsigned release APKs
        env:
          FREEDOM_UNSIGNED_RELEASE: "1"
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Every APK carries Colibri
        run: |
          for abi in arm64-v8a x86_64; do
            for lib in libc4.so libfreedom_colibri.so; do
              unzip -l "app/build/outputs/apk/release/app-$abi-release-unsigned.apk" | grep -q "lib/$abi/$lib" \
                || { echo "::error::$lib missing from the $abi APK"; exit 1; }
            done
          done

      # So a cache-built release can be compared with a source-built one.
      # Signing doesn't touch the entries, so these are the published
      # APKs' libraries too.
      - name: Native library hashes
        run: |
          {
            echo "### Native libraries"
            echo
            echo '```'
            for apk in app/build/outputs/apk/release/app-*-release-unsigned.apk; do
              for entry in $(unzip -Z1 "$apk" 'lib/*.so'); do
                echo "$(unzip -p "$apk" "$entry" | sha256sum | cut -d' ' -f1)  $(basename "$apk")!$entry"
              done
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Hand the unsigned APKs to the sign job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned
          path: app/build/outputs/apk/release/app-*-release-unsigned.apk
          if-no-files-found: error
          # As the libraries above: sign and publish can be re-run on
          # their own for as long as this lasts.
          retention-days: 14

  # The only job that sees the keystore (#469). It runs no Gradle and no
  # third-party action: just the runner's own Android SDK apksigner and
  # zipalign, between a SHA-pinned download and (once the keystore is
  # gone) upload. Schemes as AGP signed them before: v2 only (minSdk 30
  # needs no v1; no v3 or v4).
  sign:
    needs: [apk]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the unsigned APKs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned
          path: unsigned

      - name: Sign the APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $bt"
          VERSION="${GITHUB_REF_NAME:-manual}"
          VERSION="${VERSION//\//-}"   # a dry run on a branch: alan/x -> alan-x
          ks="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ks"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks")
          mkdir -p dist
          for abi in arm64-v8a x86_64 universal; do
            in="unsigned/app-$abi-release-unsigned.apk"
            out="dist/freedom-browser-$VERSION-$abi.apk"
            # AGP already aligned it (16 KB pages for the .so files);
            # apksigner keeps that alignment, so only check it.
            "$bt/zipalign" -c -P 16 4 "$in"
            "$bt/apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "${KEY_ALIAS:-freedom}" --key-pass env:KEYSTORE_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true \
              --v3-signing-enabled false --v4-signing-enabled false \
              --out "$out" "$in"
            "$bt/apksigner" verify --print-certs "$out" | grep -v '^WARNING'
          done
          cd dist && sha256sum * > SHA256SUMS
          echo "=== release contents ===" && ls -la && cat SHA256SUMS

      # Only a tag's APKs leave the job: a dry run's release-signed APKs
      # of an arbitrary branch aren't put up for download.
      - name: Hand the release to the publish job
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release
          path: dist/
          if-no-files-found: error
          # As the libraries above: a failed publish can be re-run on its
          # own for as long as this lasts.
          retention-days: 14

  # gh, preinstalled on the runner, rather than a third-party release
  # action holding a contents: write token (#469). A re-run after a
  # partial publish replaces the assets on the existing release.
  publish:
    needs: [sign, unit-tests, licences]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
