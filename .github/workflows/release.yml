# Release workflow: build the combined native library, assemble signed
# per-ABI release APKs, and publish them as a GitHub Release so users
# can sideload straight from the Releases page (mirrors ant's
# release.yml shape: tag push → build → softprops release + SHA256SUMS).
#
# Trigger: push a tag like `v0.4.0`, or run manually via the Actions
# tab (workflow_dispatch) for a dry run that builds without publishing.
#
# Secrets: KEYSTORE_BASE64 (the release keystore, base64),
# KEYSTORE_PASSWORD, KEY_ALIAS. APKs are signed with this one key
# forever — Android ties updates to the signing certificate, so the
# keystore must never be rotated casually.
#
# FFI_REF pins which freedom-mobile-ffi tag supplies the embedded
# nodes; bump it together with the vendored headers in
# swarmnode/src/main/cpp/ (see README § Building libfreedom_mobile_ffi.so).
# It must be a tag whose Cargo.toml pins its node deps by tag, and the
# README's clone lines must use it too: scripts/check-ffi-ref.sh enforces
# that here (this workflow refuses to build otherwise) and reports it on
# every PR (ffi-ref.yml — a status check only, since main has no branch
# protection).
# UNRELEASED: pinned to the alan/compose-tracing-layers commit that adds
# freedom_mobile_init_logging (#156) until freedom-mobile-ffi tags it, so
# that check fails (and this workflow refuses to build) until it's retagged.
# The library is built with ant's `chain` feature (see the build step).
#
# COLIBRI_REF pins the corpus-core/colibri-stateless tag libc4.so (the
# Colibri verifier behind proven name resolution, #100) is built from;
# bump it with the vendored swarmnode/src/main/cpp/colibri.h. A local
# build without libc4.so still works (names start at the RPC quorum), so
# this workflow checks every APK carries it.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FFI_REF: 45203550b4ec1876a6a771f4d1dd32f3504b084c
  COLIBRI_REF: v3.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FFI_REF is a tagged freedom-mobile-ffi release
        run: scripts/check-ffi-ref.sh

      - name: Checkout freedom-mobile-ffi
        uses: actions/checkout@v4
        with:
          repository: solardev-xyz/freedom-mobile-ffi
          ref: ${{ env.FFI_REF }}
          path: freedom-mobile-ffi

      # The ffi crate pins its node deps as ssh:// git URLs (local-dev
      # convenience); all repos are public, so fetch them over https.
      - name: Rewrite ssh git deps to https
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: freedom-mobile-ffi

      - name: Build libfreedom_mobile_ffi.so (arm64-v8a + x86_64)
        run: |
          # ANDROID_NDK_ROOT is the runner image's default NDK (r27.x),
          # matching the locally-verified toolchain; LATEST_HOME floats.
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cd freedom-mobile-ffi
          # build-android.sh passes --no-default-features, which drops
          # both `chain` and `radicle`. Put `chain` back (ant's on-chain
          # /wallet, /stamps, /chequebook gateway surfaces), then extend
          # it to `chain,radicle` (the embedded Radicle node). The helpers
          # fail the job if the script's cargo call ever changes shape
          # under a new FFI_REF; they're the same ones the README's local
          # build uses.
          "$GITHUB_WORKSPACE/scripts/enable-ffi-chain.sh" .
          "$GITHUB_WORKSPACE/scripts/enable-ffi-radicle.sh" .
          ./scripts/build-android.sh
          mkdir -p "$GITHUB_WORKSPACE/swarmnode/src/main/jniLibs"
          cp -r target/android/jniLibs/. "$GITHUB_WORKSPACE/swarmnode/src/main/jniLibs/"

      - name: Checkout colibri-stateless
        uses: actions/checkout@v4
        with:
          repository: corpus-core/colibri-stateless
          ref: ${{ env.COLIBRI_REF }}
          path: colibri-stateless
          fetch-depth: 0

      - name: Build libc4.so (arm64-v8a + x86_64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          C4_VERSION="${COLIBRI_REF#v}" scripts/build-colibri.sh colibri-stateless

      # The committed Kotlin bindings must match the Radicle surface this
      # .so was built with (they checksum every call at load).
      - name: Check the Radicle UniFFI bindings are current
        run: scripts/generate-radicle-bindings.sh freedom-mobile-ffi --check

      - name: Upload native diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jniLibs-debug
          path: freedom-mobile-ffi/target/android/
          if-no-files-found: ignore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release APKs
        env:
          FREEDOM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FREEDOM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export FREEDOM_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Every APK carries Colibri
        run: |
          for abi in arm64-v8a x86_64; do
            for lib in libc4.so libfreedom_colibri.so; do
              unzip -l "app/build/outputs/apk/release/app-$abi-release.apk" | grep -q "lib/$abi/$lib" \
                || { echo "::error::$lib missing from the $abi APK"; exit 1; }
            done
          done

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p dist
          for abi in arm64-v8a x86_64 universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" \
               "dist/freedom-browser-$VERSION-$abi.apk"
          done
          cd dist && sha256sum * > SHA256SUMS
          echo "=== release contents ===" && ls -la && cat SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
