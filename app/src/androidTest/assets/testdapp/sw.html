<!doctype html>
<html>
<head><meta charset="utf-8"><title>sw test page</title></head>
<body>
  <h1 id="marker">sw-page</h1>
  <script>
    window.results = window.results || {};
    if (!('serviceWorker' in navigator)) {
      window.results.swState = 'unavailable';
    } else {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then((reg) => navigator.serviceWorker.ready)
        .then(() => { window.results.swState = 'active'; })
        .catch((e) => { window.results.swState = 'error:' + e; });
    }
  </script>
</body>
</html>
