<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:*;"
    />
    <title></title>
    <style>
      /* The app's colours and the error pages' shared layout (#419): kept
         equal to errorPageThemeCss() + ERROR_PAGE_CSS in WebLoadError.kt by
         ErrorPageThemeTest. */
      /* THEME */:root{color-scheme:light dark;--bg:#fef7ff;--fg:#1d1b20;--mut:#49454f;--box:#ece6f0;--line:#cac4d0;--pri:#00695b;--onpri:#ffffff;--warn:#6f5300}@media (prefers-color-scheme:dark){:root{--bg:#141218;--fg:#e6e0e9;--mut:#cac4d0;--box:#2b2930;--line:#49454f;--pri:#00e9c4;--onpri:#00382f;--warn:#ffb111}}html,body{margin:0;min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:48px 24px;box-sizing:border-box;overflow-wrap:break-word}.c{max-width:560px;margin:0 auto}h1{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 12px;color:var(--fg)}p{line-height:1.55;margin:0 0 24px;color:var(--mut);font-size:16px}p b{color:var(--fg)}.b{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 28px}.btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:48px;min-width:0;max-width:100%;padding:12px 24px;border-radius:24px;font:inherit;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--pri);text-align:center}.btn.p{background:var(--pri);border-color:var(--pri);color:var(--onpri)}.btn.w{color:var(--warn);border-color:var(--warn)}details{border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:var(--mut);font-size:14px;line-height:48px;min-height:48px}.d{background:var(--box);padding:14px 16px;border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mut);margin:4px 0 0;word-break:break-all;white-space:pre-wrap}.nodes-icon{display:inline-block;width:1.2em;height:1.2em;vertical-align:middle;margin:0 2px}/* /THEME */
      body:not(.ready) .container {
        visibility: hidden;
      }
      [hidden] {
        display: none !important;
      }
      #auto-retry {
        margin: -12px 0 24px;
      }
    </style>
  </head>
  <body>
    <div class="c container">
      <h1 id="title"></h1>
      <p id="description"></p>
      <p id="auto-retry" hidden></p>
      <div class="b">
        <button id="retry-btn" class="btn p"></button>
        <button id="continue-btn" class="btn w" hidden></button>
        <button id="auto-retry-stop" class="btn" hidden></button>
      </div>
      <details>
        <summary id="details-label"></summary>
        <div id="details" class="d"></div>
      </details>
    </div>

    <script>
      // The page's text, in the app's language (#280). The app can't
      // serve this asset itself (WebView doesn't ask the interceptor for
      // file:///android_asset/), so it hands the page its string table
      // once the page has committed: evaluateJavascript calls
      // window.__errorPageStrings(table) (ErrorPage.stringsScript). Keys
      // are the `errorpage_` resources' names without that prefix.
      // Nothing shows until then, so no half-English page flashes; if it
      // never comes, the page shows in English (FALLBACK, below).
      let S = {};

      // The string [key] with its `%1$s`-style arguments filled in.
      function fmt(key, ...args) {
        return (S[key] || '').replace(/%(\d+)\$s|%%/g, (m, n) => (n ? String(args[n - 1]) : '%'));
      }

      // [fmt] as a list of text pieces and [args] as they are (a node
      // stays a node), for `append`: nothing becomes HTML.
      function fmtNodes(key, ...args) {
        const text = S[key] || '';
        const out = [];
        const re = /%(\d+)\$s|%%/g;
        let last = 0;
        let m;
        while ((m = re.exec(text))) {
          out.push(text.slice(last, m.index), m[1] ? args[m[1] - 1] : '%');
          last = re.lastIndex;
        }
        out.push(text.slice(last));
        return out;
      }

      const NODES_ICON =
        '<svg class="nodes-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><style>.net-line{stroke:currentColor;stroke-width:8;stroke-linecap:round}.net-node{fill:none;stroke:currentColor;stroke-width:8}</style><line x1="44.5" y1="33.5" x2="25.5" y2="66.5" class="net-line"/><line x1="55.5" y1="33.5" x2="74.5" y2="66.5" class="net-line"/><line x1="31" y1="76" x2="69" y2="76" class="net-line"/><circle cx="50" cy="24" r="11" class="net-node"/><circle cx="20" cy="76" r="11" class="net-node"/><circle cx="80" cy="76" r="11" class="net-node"/></svg>';

      function detectProtocol(url) {
        if (!url) return null;
        if (url.match(/^bzz:\/\//i) || url.match(/\/bzz\//i)) return 'swarm';
        if (url.match(/^ipfs:\/\//i) || url.match(/\/ipfs\//i)) return 'ipfs';
        if (url.match(/^ipns:\/\//i) || url.match(/\/ipns\//i)) return 'ipns';
        return null;
      }

      function toProtocolUrl(url) {
        if (!url) return null;
        const bzzMatch = url.match(/\/bzz\/([a-fA-F0-9]{64,128})(\/.*)?/);
        if (bzzMatch) return 'bzz://' + bzzMatch[1] + (bzzMatch[2] || '');
        const ipfsMatch = url.match(/\/ipfs\/([a-zA-Z0-9]+)(\/.*)?/);
        if (ipfsMatch) return 'ipfs://' + ipfsMatch[1] + (ipfsMatch[2] || '');
        const ipnsMatch = url.match(/\/ipns\/([a-zA-Z0-9.-]+)(\/.*)?/);
        if (ipnsMatch) return 'ipns://' + ipnsMatch[1] + (ipnsMatch[2] || '');
        return url;
      }

      // Which name system a name failure belongs to, from the display
      // URL's host (`alice.wei/p`, `bzz://name.gwei`). Mirrors desktop's
      // `nameSystemLabelForName`.
      function nameSystemLabel(url) {
        const host = (url || '')
          .replace(/^[a-z][a-z0-9+.-]*:\/\//i, '')
          .split(/[\/?#]/)[0]
          .toLowerCase();
        if (host.endsWith('.wei')) return 'WNS';
        if (host.endsWith('.gwei')) return 'GNS';
        if (host.endsWith('.tez')) return 'Tezos Domains';
        return 'ENS';
      }

      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      const url = params.get('url');
      const explicitProtocol = params.get('protocol');
      const retryUrl = params.get('retry') || url;
      const detail = params.get('detail');
      const continueUrl = params.get('continue');
      const resolved = params.get('resolved');
      // Why a Swarm probe gave up (GatewayProbe, ErrorPage.SwarmFailure);
      // absent on a failed WebView load and on older history entries.
      const swarmReason = params.get('reason');
      const swarmStatus = params.get('status');
      const swarmPeers = params.get('peers') === null ? null : Number(params.get('peers'));
      // This failure follows straight on from this page's own retry.
      const continuesRetryStreak = params.get('streak') === '1';
      // What the Try Again button says; a page can name its way on.
      let retryLabel = null;
      const NETWORKS = { bzz: 'Swarm', ipfs: 'IPFS', ipns: 'IPNS' };

      function schemeOf(u) {
        const m = (u || '').match(/^([a-z][a-z0-9+.-]*):\/\//i);
        return m ? m[1].toLowerCase() : null;
      }
      const protocolUrl = toProtocolUrl(url);
      const protocol = explicitProtocol || detectProtocol(url);

      const detailsEl = document.getElementById('details');
      const descriptionEl = document.getElementById('description');
      const titleEl = document.getElementById('title');
      const nameLabel = nameSystemLabel(url);
      // Whose RPC servers answer for it: Tezos Domains isn't on Ethereum.
      const chainLabel = nameLabel === 'Tezos Domains' ? 'Tezos' : 'Ethereum';

      async function checkSwarmStatus() {
        try {
          // no-cors: this page's origin is `null`, and the gateway allows
          // no CORS origins (#284), so a CORS fetch could never read the
          // answer. An opaque answer only proves *something* answered HTTP
          // on :1633 — its status is hidden, so a 5xx, or another app bound
          // to the port, also reads as running. That's fine for ant, whose
          // /health always answers 200 once the gateway listens; a gateway
          // that isn't listening rejects the fetch.
          await fetch('http://127.0.0.1:1633/health', { mode: 'no-cors', cache: 'no-store' });
          return { running: true };
        } catch (e) {
          return { running: false };
        }
      }

      // The address (and the resolver's detail line) as the page prints
      // it: every bidi control shown as U+FFFD, as the address bar does
      // (BidiControls.kt, the same Bidi_Control list).
      // A name ENSIP-15 refuses reaches this page as given, and one RLO
      // in it (`ens://%E2%80%AEmoc.lapyap.eth`) printed `hte.paypal.com`.
      function shown(text) {
        return text.replace(/\p{Bidi_Control}/gu, '\uFFFD');
      }

      // Below this many connected peers a node is still warming up, so a
      // miss says more about the node than about the content.
      const LOW_PEER_COUNT = 10;

      function describeLastAnswer(status) {
        if (status === 'no_response') return fmt('page_swarm_answer_none');
        return fmt('page_swarm_answer_http', status);
      }

      // Title, description (text, not HTML), details line and whether
      // trying again later can help, for a swarm_content_not_found page.
      function describeSwarmFailure() {
        switch (swarmReason) {
          case 'path_not_found':
            return {
              title: fmt('page_swarm_path_not_found_title'),
              description: fmt('page_swarm_path_not_found'),
              detail: fmt('page_swarm_path_not_found_detail'),
              recoverable: false,
            };
          case 'other':
            return {
              title: fmt('page_swarm_other_title'),
              description: fmt('page_swarm_other', swarmStatus || '?'),
              detail: fmt('page_swarm_other_detail', swarmStatus || '?'),
              recoverable: false,
            };
          default: {
            // 'not_found': the probe's 5-minute budget ran out. No
            // reason: a failed load, or a page from before #536.
            const peers = Number.isFinite(swarmPeers) ? swarmPeers : null;
            let description;
            // An ENS site's failed load (protocol `ens`) is as likely a
            // Swarm one as not; only a known IPFS load gets IPFS copy.
            if (protocol === 'ipfs' || protocol === 'ipns') description = fmt('page_ipfs_not_found');
            else if (peers === 1) description = fmt('page_swarm_one_peer');
            else if (peers !== null && peers < LOW_PEER_COUNT) description = fmt('page_swarm_few_peers', peers);
            else description = fmt('page_swarm_not_found');
            let detail;
            if (swarmReason !== 'not_found') detail = fmt('page_swarm_not_found_detail');
            else if (peers === 1) detail = fmt('page_swarm_timeout_one_peer_detail', describeLastAnswer(swarmStatus));
            else if (peers !== null) detail = fmt('page_swarm_timeout_peers_detail', describeLastAnswer(swarmStatus), peers);
            else detail = fmt('page_swarm_timeout_detail', describeLastAnswer(swarmStatus));
            return {
              title: fmt('page_swarm_not_found_title'),
              description,
              detail,
              // Only a probe that ran out of time retries on its own. A
              // page without a reason is a load that failed after the
              // probe let it through (an IPFS path its root doesn't
              // have, say): retrying it every 30 s would never end,
              // since such a page never continues a streak.
              recoverable: swarmReason === 'not_found',
            };
          }
        }
      }

      // Content can still spread through the network and a node can still
      // gain peers, so a recoverable miss tries again on its own (desktop
      // #618). Each retry runs a fresh probe (up to 5 minutes), so the
      // waits stay short; the count lives in sessionStorage because each
      // retry lands on a new copy of this page, and the app says
      // (`streak=1`) whether this page continues that count. Try Again
      // starts it over. Unlike desktop, a page without a reason doesn't
      // retry on its own (see describeSwarmFailure). The countdown only runs while the page is
      // visible: WebView's timers keep running in a tab in the
      // background, or with the app in the background, and a retry
      // there would be a 5-minute probe nobody is waiting for.
      const AUTO_RETRY_DELAYS_S = [30, 60, 120, 300, 300, 300];
      // A count older than this belongs to an earlier visit.
      const AUTO_RETRY_STREAK_MS = 30 * 60000;
      // One key for every address: `streak=1` already says the previous
      // page retried this same one, and no address is left in storage.
      const autoRetryKey = 'freedom:auto-retry';
      const autoRetryEl = document.getElementById('auto-retry');
      const autoRetryStopBtn = document.getElementById('auto-retry-stop');
      // null: none; else { state: 'counting' | 'retrying' | 'stopped' |
      // 'exhausted' | 'paused', remaining }. Kept across displayError's
      // second run (the app's strings after the English fallback).
      let autoRetry = null;
      let autoRetryTimer = null;

      function readAutoRetryCount() {
        try {
          const saved = JSON.parse(sessionStorage.getItem(autoRetryKey) || 'null');
          if (!saved || !(Date.now() - saved.at <= AUTO_RETRY_STREAK_MS)) return 0;
          return Number.isInteger(saved.count) ? saved.count : 0;
        } catch (e) {
          return 0;
        }
      }

      function writeAutoRetryCount(count) {
        try {
          if (count === 0) sessionStorage.removeItem(autoRetryKey);
          else sessionStorage.setItem(autoRetryKey, JSON.stringify({ count, at: Date.now() }));
        } catch (e) {
          // No storage: retries still happen, just without the cap.
        }
      }

      function renderAutoRetry() {
        if (!autoRetry) return;
        const text = {
          counting: () => fmt('page_auto_retry_in', autoRetry.remaining),
          retrying: () => fmt('page_auto_retry_now'),
          stopped: () => fmt('page_auto_retry_stopped'),
          exhausted: () => fmt('page_auto_retry_stopped'),
          paused: () => fmt('page_auto_retry_paused'),
        }[autoRetry.state]();
        autoRetryEl.hidden = false;
        autoRetryEl.textContent = text;
        autoRetryStopBtn.hidden = autoRetry.state !== 'counting';
        autoRetryStopBtn.textContent = fmt('page_auto_retry_stop');
      }

      function stopAutoRetry(state) {
        clearInterval(autoRetryTimer);
        autoRetryTimer = null;
        autoRetry.state = state;
        renderAutoRetry();
      }

      // How this copy of the page was reached. Back/Forward onto it is
      // the user reading history, not a fresh failure, and a restored
      // tab is the same: no countdown then, only Try Again.
      function reachedByNavigation() {
        try {
          const entry = performance.getEntriesByType('navigation')[0];
          return !entry || entry.type === 'navigate';
        } catch (e) {
          return true;
        }
      }

      function scheduleAutoRetry() {
        if (autoRetry) {
          renderAutoRetry();
          return;
        }
        if (!retryUrl) return;
        if (!reachedByNavigation()) {
          autoRetry = { state: 'paused' };
          renderAutoRetry();
          return;
        }
        if (!continuesRetryStreak) writeAutoRetryCount(0);
        const count = readAutoRetryCount();
        if (count >= AUTO_RETRY_DELAYS_S.length) {
          autoRetry = { state: 'exhausted' };
          renderAutoRetry();
          return;
        }
        autoRetry = { state: 'counting', remaining: AUTO_RETRY_DELAYS_S[count] };
        renderAutoRetry();
        autoRetryTimer = setInterval(() => {
          if (document.visibilityState !== 'visible') return;
          autoRetry.remaining -= 1;
          if (autoRetry.remaining > 0) {
            renderAutoRetry();
            return;
          }
          stopAutoRetry('retrying');
          writeAutoRetryCount(count + 1);
          window.location.href = retryUrl;
        }, 1000);
      }

      async function displayError() {
        const parts = [];
        if (protocolUrl) parts.push(shown(protocolUrl));
        else if (url) parts.push(shown(url));

        if (error === 'ens_not_found') {
          titleEl.textContent = fmt('ens_not_found_title', nameLabel);
          // ENS goes through a per-name resolver; WNS/GNS store records
          // straight on their registry, so there the other cause is the
          // name not being registered. Tezos Domains publishes a website
          // record rather than a contenthash, and names expire.
          descriptionEl.innerHTML =
            nameLabel === 'Tezos Domains'
              ? fmt('page_ens_not_found_tezos')
              : nameLabel === 'ENS'
                ? fmt('page_ens_not_found_no_resolver', nameLabel)
                : fmt('page_ens_not_found_unregistered', nameLabel);
        } else if (error === 'ens_wrong_protocol') {
          // #97: a typed scheme is an assertion, never silently switched.
          titleEl.textContent = fmt('ens_wrong_protocol_title');
          const asserted = schemeOf(url);
          if (resolved && asserted && NETWORKS[resolved] && NETWORKS[asserted]) {
            descriptionEl.textContent = fmt(
              'page_wrong_protocol_networks',
              nameLabel,
              NETWORKS[resolved],
              NETWORKS[asserted],
              asserted
            );
            retryLabel = fmt('page_open_on_network', NETWORKS[resolved]);
          } else {
            descriptionEl.innerHTML =
              nameLabel === 'Tezos Domains'
                ? fmt('page_wrong_protocol_website_record', nameLabel)
                : fmt('page_wrong_protocol_contenthash', nameLabel);
          }
        } else if (error === 'ens_unsupported_codec') {
          titleEl.textContent = fmt('unsupported_format_title');
          descriptionEl.innerHTML = fmt('page_unsupported_codec', nameLabel);
        } else if (error === 'ens_invalid_name') {
          titleEl.textContent = fmt('ens_invalid_name_title', nameLabel);
          descriptionEl.innerHTML = fmt('ens_invalid_name_description', nameLabel);
        } else if (error === 'ens_name_too_long') {
          titleEl.textContent = fmt('ens_name_too_long_title', nameLabel);
          descriptionEl.innerHTML = fmt('ens_name_too_long_description', nameLabel);
        } else if (error === 'ens_unverified') {
          // #96: only one RPC server's word for where the name leads.
          document.body.classList.add('warn');
          titleEl.textContent = fmt('not_cross_checked_title');
          descriptionEl.innerHTML = fmt('page_ens_unverified', chainLabel, nameLabel);
        } else if (error === 'ens_conflict') {
          // #96: the servers asked gave different answers.
          titleEl.textContent = fmt('rpc_disagreed_title');
          descriptionEl.innerHTML = fmt('page_ens_conflict', chainLabel, nameLabel);
        } else if (error === 'ens_lookup_failed') {
          titleEl.textContent = fmt('lookup_failed_title', nameLabel);
          if (detail === 'CCIP_DISABLED') {
            descriptionEl.innerHTML = fmt('ccip_disabled_description');
          } else if (nameLabel === 'Tezos Domains') {
            descriptionEl.innerHTML = fmt('tezos_rpc_unreachable_description');
          } else {
            descriptionEl.innerHTML = fmt('ethereum_rpc_unreachable_description');
          }
        } else if (error === 'web3_unverified') {
          // #123: an onchain app's code only one RPC server returned.
          document.body.classList.add('warn');
          titleEl.textContent = fmt('not_cross_checked_title');
          descriptionEl.innerHTML = fmt('page_web3_unverified');
        } else if (error === 'web3_conflict') {
          titleEl.textContent = fmt('rpc_disagreed_title');
          descriptionEl.innerHTML = fmt('page_web3_conflict');
        } else if (error === 'web3_unknown_chain') {
          titleEl.textContent = fmt('page_web3_unknown_chain_title');
          descriptionEl.innerHTML = fmt('page_web3_unknown_chain');
        } else if (error === 'web3_not_an_app') {
          titleEl.textContent = fmt('page_web3_not_an_app_title');
          descriptionEl.innerHTML = fmt('page_web3_not_an_app');
        } else if (error === 'web3_too_large') {
          titleEl.textContent = fmt('page_web3_too_large_title');
          descriptionEl.innerHTML = fmt('page_web3_too_large');
        } else if (error === 'web3_invalid') {
          titleEl.textContent = fmt('page_web3_invalid_title');
          descriptionEl.innerHTML = fmt('page_web3_invalid');
        } else if (error === 'web3_lookup_failed') {
          titleEl.textContent = fmt('page_web3_lookup_failed_title');
          descriptionEl.innerHTML = fmt('page_web3_lookup_failed');
        } else if (error && error.indexOf('cert_') === 0) {
          // #259: an https site whose certificate failed. Always refused
          // (no proceed-anyway); the host is the page's word, so it goes
          // in as text, never as HTML.
          const CERT_DESCRIPTIONS = {
            cert_expired: (b) => fmtNodes('cert_description_expired', b),
            cert_not_yet_valid: (b) => fmtNodes('cert_description_not_yet_valid', b),
            cert_date_invalid: (b) => fmtNodes('cert_description_date_invalid', b),
            cert_wrong_host: (b) => fmtNodes('cert_description_wrong_host', b),
            cert_untrusted: (b) => fmtNodes('cert_description_untrusted', b),
          };
          const describe =
            CERT_DESCRIPTIONS[error] || ((b) => fmtNodes('cert_description_invalid', b));
          const host =
            shown((url || '').replace(/^[a-z][a-z0-9+.-]*:\/\//i, '').split(/[\/?#]/)[0] || url || '');
          titleEl.textContent = fmt('cert_title');
          descriptionEl.textContent = '';
          descriptionEl.append(
            ...describe(Object.assign(document.createElement('b'), { textContent: host })),
            ' ' + fmt('cert_description_risk')
          );
          document.title = fmt('cert_title');
          if (detail) parts.push('');
        } else if (error === 'swarm_content_not_found') {
          // The node answered, but not with the content. Say which way
          // it failed (#536): the old copy blamed peers and a timeout for
          // every failure, a missing page included.
          const failure = describeSwarmFailure();
          titleEl.textContent = failure.title;
          document.title = failure.title;
          descriptionEl.textContent = failure.description;
          parts.push('');
          parts.push(failure.detail);
          if (failure.recoverable) scheduleAutoRetry();
        } else if (error && error.indexOf('ERR_CONNECTION_REFUSED') !== -1) {
          if (protocol === 'swarm') {
            const status = await checkSwarmStatus();
            if (!status.running) {
              descriptionEl.innerHTML = fmt('page_swarm_node_stopped', NODES_ICON);
            } else {
              descriptionEl.innerHTML = fmt('page_swarm_gateway_unreachable');
            }
          }
          parts.push('');
          parts.push(error);
        } else if (error) {
          parts.push('');
          parts.push(error);
        }

        if (detail) {
          parts.push(shown(detail));
        }

        detailsEl.textContent = parts.join('\n') || fmt('page_unknown_error');
        // A not-cross-checked warning (#96) asks the user to judge the
        // address in the box before Continue: keep it open there (#419).
        if (document.body.classList.contains('warn')) detailsEl.parentElement.open = true;
        if (retryLabel) document.getElementById('retry-btn').textContent = retryLabel;
      }

      // The English text, in case the app's table never comes: the page
      // is never left blank without a Retry. Kept equal to the English
      // resources by ErrorPageStringsTest; the app's table, in the app's
      // language, replaces it whenever it arrives.
