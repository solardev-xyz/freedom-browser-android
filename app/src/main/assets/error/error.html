<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:*;"
    />
    <title>Content Unavailable</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(ellipse at top left, #1f1f1f 0%, #141414 60%);
        color: #f5f5f5;
        padding: 32px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-sizing: border-box;
      }
      .container {
        max-width: 560px;
        width: 100%;
      }
      h1 {
        font-size: 22px;
        margin: 24px 0 12px 0;
        color: #ff5e5e;
      }
      p {
        line-height: 1.55;
        margin: 0 0 20px 0;
        color: #ccc;
        font-size: 15px;
      }
      .error-details {
        background: #1a1a1a;
        padding: 14px 16px;
        border-radius: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: #ff8a8a;
        margin: 0 0 24px 0;
        word-break: break-all;
        white-space: pre-wrap;
        text-align: left;
      }
      button {
        padding: 12px 22px;
        background: #2c2c2c;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        min-height: 44px;
      }
      button:active {
        background: #3a3a3a;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      /* Not cross-checked (#96): a caution, not a failure. */
      body.warn h1 {
        color: #f0a030;
      }
      body.warn .error-details {
        color: #f5c270;
      }
      #continue-btn {
        background: #8a5a00;
        border-color: #b07400;
      }
      #continue-btn:active {
        background: #a06a00;
      }
      .nodes-icon {
        display: inline-block;
        width: 1.2em;
        height: 1.2em;
        vertical-align: middle;
        margin: 0 2px;
      }

      @media (prefers-color-scheme: light) {
        body {
          background: radial-gradient(ellipse at top left, #f6f8fa 0%, #ffffff 60%);
          color: #24292f;
        }
        h1 {
          color: #cf222e;
        }
        p {
          color: #57606a;
        }
        .error-details {
          background: #f6f8fa;
          color: #cf222e;
        }
        button {
          background: #f6f8fa;
          border-color: #d0d7de;
          color: #24292f;
        }
        button:active {
          background: #e8eaed;
        }
        body.warn h1 {
          color: #9a6700;
        }
        body.warn .error-details {
          color: #7d4e00;
        }
        #continue-btn {
          background: #9a6700;
          border-color: #7d4e00;
          color: #fff;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="title">Content Unavailable</h1>
      <p id="description">
        This content could not be retrieved from the decentralized network. The address may be
        invalid, the content may no longer exist, or no peers are serving it.
      </p>
      <div id="details" class="error-details"></div>
      <div class="buttons">
        <button id="continue-btn" hidden>Continue once</button>
        <button id="retry-btn">Try Again</button>
      </div>
    </div>

    <script>
      const NODES_ICON =
        '<svg class="nodes-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><style>.net-line{stroke:currentColor;stroke-width:8;stroke-linecap:round}.net-node{fill:none;stroke:currentColor;stroke-width:8}</style><line x1="44.5" y1="33.5" x2="25.5" y2="66.5" class="net-line"/><line x1="55.5" y1="33.5" x2="74.5" y2="66.5" class="net-line"/><line x1="31" y1="76" x2="69" y2="76" class="net-line"/><circle cx="50" cy="24" r="11" class="net-node"/><circle cx="20" cy="76" r="11" class="net-node"/><circle cx="80" cy="76" r="11" class="net-node"/></svg>';

      function detectProtocol(url) {
        if (!url) return null;
        if (url.match(/^bzz:\/\//i) || url.match(/\/bzz\//i)) return 'swarm';
        if (url.match(/^ipfs:\/\//i) || url.match(/\/ipfs\//i)) return 'ipfs';
        if (url.match(/^ipns:\/\//i) || url.match(/\/ipns\//i)) return 'ipns';
        return null;
      }

      function toProtocolUrl(url) {
        if (!url) return null;
        const bzzMatch = url.match(/\/bzz\/([a-fA-F0-9]{64,128})(\/.*)?/);
        if (bzzMatch) return 'bzz://' + bzzMatch[1] + (bzzMatch[2] || '');
        const ipfsMatch = url.match(/\/ipfs\/([a-zA-Z0-9]+)(\/.*)?/);
        if (ipfsMatch) return 'ipfs://' + ipfsMatch[1] + (ipfsMatch[2] || '');
        const ipnsMatch = url.match(/\/ipns\/([a-zA-Z0-9.-]+)(\/.*)?/);
        if (ipnsMatch) return 'ipns://' + ipnsMatch[1] + (ipnsMatch[2] || '');
        return url;
      }

      // Which name system a name failure belongs to, from the display
      // URL's host (`alice.wei/p`, `bzz://name.gwei`). Mirrors desktop's
      // `nameSystemLabelForName`.
      function nameSystemLabel(url) {
        const host = (url || '')
          .replace(/^[a-z][a-z0-9+.-]*:\/\//i, '')
          .split(/[\/?#]/)[0]
          .toLowerCase();
        if (host.endsWith('.wei')) return 'WNS';
        if (host.endsWith('.gwei')) return 'GNS';
        if (host.endsWith('.tez')) return 'Tezos Domains';
        return 'ENS';
      }

      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      const url = params.get('url');
      const explicitProtocol = params.get('protocol');
      const retryUrl = params.get('retry') || url;
      const detail = params.get('detail');
      const continueUrl = params.get('continue');
      const resolved = params.get('resolved');
      // What the Try Again button says; a page can name its way on.
      let retryLabel = null;
      const NETWORKS = { bzz: 'Swarm', ipfs: 'IPFS', ipns: 'IPNS' };

      function schemeOf(u) {
        const m = (u || '').match(/^([a-z][a-z0-9+.-]*):\/\//i);
        return m ? m[1].toLowerCase() : null;
      }
      const protocolUrl = toProtocolUrl(url);
      const protocol = explicitProtocol || detectProtocol(url);

      const detailsEl = document.getElementById('details');
      const descriptionEl = document.getElementById('description');
      const titleEl = document.getElementById('title');
      const nameLabel = nameSystemLabel(url);
      // Whose RPC servers answer for it: Tezos Domains isn't on Ethereum.
      const chainLabel = nameLabel === 'Tezos Domains' ? 'Tezos' : 'Ethereum';

      async function checkSwarmStatus() {
        try {
          // no-cors: this page's origin is `null`, and the gateway allows
          // no CORS origins (#284), so a CORS fetch could never read the
          // answer. An opaque answer only proves *something* answered HTTP
          // on :1633 — its status is hidden, so a 5xx, or another app bound
          // to the port, also reads as running. That's fine for ant, whose
          // /health always answers 200 once the gateway listens; a gateway
          // that isn't listening rejects the fetch.
          await fetch('http://127.0.0.1:1633/health', { mode: 'no-cors', cache: 'no-store' });
          return { running: true };
        } catch (e) {
          return { running: false };
        }
      }

      async function displayError() {
        const parts = [];
        if (protocolUrl) parts.push(protocolUrl);
        else if (url) parts.push(url);

        if (error === 'ens_not_found') {
          titleEl.textContent = 'No content for this ' + nameLabel + ' name';
          // ENS goes through a per-name resolver; WNS/GNS store records
          // straight on their registry, so there the other cause is the
          // name not being registered. Tezos Domains publishes a website
          // record rather than a contenthash, and names expire.
          const otherCause =
            nameLabel === 'ENS' ? 'the name has no resolver' : "the name isn't registered";
          descriptionEl.innerHTML =
            nameLabel === 'Tezos Domains'
              ? "This Tezos Domains name doesn't point at a website. The owner may not have set a " +
                "<code>web:content_url</code> record, the name isn't registered, or it has expired."
              : "This " + nameLabel + " name doesn't point at any content yet. The owner may not have set a " +
                '<code>contenthash</code> record, or ' + otherCause + '.';
        } else if (error === 'ens_wrong_protocol') {
          // #97: a typed scheme is an assertion, never silently switched.
          titleEl.textContent = 'Name lives on a different network';
          const asserted = schemeOf(url);
          if (resolved && asserted && NETWORKS[resolved] && NETWORKS[asserted]) {
            descriptionEl.textContent =
              'This ' + nameLabel + ' name resolves to ' + NETWORKS[resolved] + ' content, not ' +
              NETWORKS[asserted] + '. The ' + asserted + ':// you typed asks for ' +
              NETWORKS[asserted] + ' only, so Freedom did not switch networks for you.';
            retryLabel = 'Open on ' + NETWORKS[resolved];
          } else {
            descriptionEl.innerHTML =
              'This ' + nameLabel + ' name resolves to content on a different network than the ' +
              'scheme you typed asks for. Try the name on its own &mdash; the browser ' +
              'will follow wherever its ' +
              (nameLabel === 'Tezos Domains' ? 'website record' : '<code>contenthash</code>') +
              ' points.';
          }
        } else if (error === 'ens_unsupported_codec') {
          titleEl.textContent = 'Unsupported content format';
          descriptionEl.innerHTML =
            'This ' + nameLabel + ' name resolves to a content format Freedom Browser cannot load yet on mobile.';
        } else if (error === 'ens_invalid_name') {
          titleEl.textContent = 'Not a valid ' + nameLabel + ' name';
          descriptionEl.innerHTML =
            'This name breaks the ENSIP-15 naming rules ' +
            '(a disallowed character, mixed scripts, a lookalike, &hellip;), so Freedom Browser ' +
            "won't look it up &mdash; other " + nameLabel + ' apps refuse it too, and it could be ' +
            'mistaken for a different name. Check the spelling.';
        } else if (error === 'ens_name_too_long') {
          titleEl.textContent = nameLabel + ' name too long';
          descriptionEl.innerHTML =
            'A label of this name is longer than the 255 bytes an ' + nameLabel + ' lookup can ' +
            'carry, so Freedom Browser can\'t ask a resolver about it. Check the address.';
        } else if (error === 'ens_unverified') {
          // #96: only one RPC server's word for where the name leads.
          document.body.classList.add('warn');
          titleEl.textContent = 'Not cross-checked';
          descriptionEl.innerHTML =
            'Only one ' + chainLabel + ' RPC server answered for this ' + nameLabel + ' name, so ' +
            "Freedom couldn't check its answer against another server. The address " +
            'below may be right, but a single misbehaving server could have picked it.';
        } else if (error === 'ens_conflict') {
          // #96: the servers asked gave different answers.
          titleEl.textContent = 'RPC servers disagreed';
          descriptionEl.innerHTML =
            'The ' + chainLabel + ' RPC servers Freedom asked gave different answers for this ' +
            nameLabel + ' name. At least one of them is wrong &mdash; or lying &mdash; so ' +
            'nothing was loaded. Try again in a moment.';
        } else if (error === 'ens_lookup_failed') {
          titleEl.textContent = nameLabel + ' lookup failed';
          if (detail === 'CCIP_DISABLED') {
            descriptionEl.innerHTML =
              'This name is resolved through an off-chain gateway (CCIP-Read), which is ' +
              'turned off in Settings &rarr; Name resolution.';
          } else if (nameLabel === 'Tezos Domains') {
            descriptionEl.innerHTML =
              "Couldn't reach a Tezos RPC endpoint to resolve this name. Check your " +
              'connection and try again.';
          } else {
            descriptionEl.innerHTML =
              "Couldn't reach an Ethereum RPC endpoint to resolve this name. Check your " +
              'connection, or the endpoints in Settings &rarr; RPC providers, and try again.';
          }
        } else if (error === 'web3_unverified') {
          // #123: an onchain app's code only one RPC server returned.
          document.body.classList.add('warn');
          titleEl.textContent = 'Not cross-checked';
          descriptionEl.innerHTML =
            "Only one RPC server returned this onchain app's code, so Freedom couldn't " +
            'check it against another server. It may be the real app, but a single ' +
            'misbehaving server could have changed it. Continue only if you trust that ' +
            'server with this app.';
        } else if (error === 'web3_conflict') {
          titleEl.textContent = 'RPC servers disagreed';
          descriptionEl.innerHTML =
            "The RPC servers Freedom asked returned different code for this onchain app. " +
            'At least one of them is wrong &mdash; or lying &mdash; so nothing was run. ' +
            'Try again in a moment.';
        } else if (error === 'web3_unknown_chain') {
          titleEl.textContent = 'Unknown chain';
          descriptionEl.innerHTML =
            "This app lives on a chain that isn't in your chain list, so Freedom doesn't " +
            'know which RPC servers to ask. Add the chain in Settings, then try again.';
        } else if (error === 'web3_not_an_app') {
          titleEl.textContent = 'Not an onchain app';
          descriptionEl.innerHTML =
            "The contract didn't return an ERC-8244 <code>html()</code> document on this " +
            'chain. Check the address and the chain ID.';
        } else if (error === 'web3_too_large') {
          titleEl.textContent = 'App too large';
          descriptionEl.innerHTML = "The app's document is larger than Freedom loads.";
        } else if (error === 'web3_invalid') {
          titleEl.textContent = 'Not a web3:// app address';
          descriptionEl.innerHTML =
            'Freedom loads web3:// apps by contract address: ' +
            '<code>web3://0x&hellip;[:chainId]/</code>. Names are not supported yet.';
        } else if (error === 'web3_lookup_failed') {
          titleEl.textContent = "Couldn't read the app";
          descriptionEl.innerHTML =
            "Couldn't get an answer from the chain's RPC servers. Check your connection " +
            'and try again.';
        } else if (error && error.indexOf('cert_') === 0) {
          // #259: an https site whose certificate failed. Always refused
          // (no proceed-anyway); the host is the page's word, so it goes
          // in as text, never as HTML.
          const CERT_REASONS = {
            cert_expired: 'has expired',
            cert_not_yet_valid:
              "isn't valid yet. If your device's date and time are wrong, correct them and try again",
            cert_date_invalid: 'has invalid dates',
            cert_wrong_host: 'was issued for a different site',
            cert_untrusted: "wasn't issued by an authority this device trusts",
          };
          const host =
            (url || '').replace(/^[a-z][a-z0-9+.-]*:\/\//i, '').split(/[\/?#]/)[0] || url || '';
          titleEl.textContent = "Connection isn't secure";
          descriptionEl.textContent = '';
          descriptionEl.append(
            "Freedom didn't load ",
            Object.assign(document.createElement('b'), { textContent: host }),
            ' because its security certificate ' + (CERT_REASONS[error] || 'is not valid') + '. ' +
              'Someone could be impersonating the site or intercepting the connection, or ' +
              'the site is misconfigured.'
          );
          document.title = "Connection isn't secure";
          if (detail) parts.push('');
        } else if (error === 'swarm_content_not_found') {
          titleEl.textContent = 'Content not ready yet';
          descriptionEl.innerHTML =
            "Couldn't find this content on the Swarm network yet. The node is " +
            'still connecting to peers &mdash; try again in a moment.';
          if (protocolUrl) {
            parts.push('');
            parts.push('Swarm content not found (timeout)');
          }
        } else if (error && error.indexOf('ERR_CONNECTION_REFUSED') !== -1) {
          if (protocol === 'swarm') {
            const status = await checkSwarmStatus();
            if (!status.running) {
              descriptionEl.innerHTML =
                'The Swarm node is not running. Open the Nodes panel ' +
                NODES_ICON +
                ' from the menu to start it.';
            } else {
              descriptionEl.innerHTML =
                "Couldn't reach the Swarm gateway. Check that the node is running and try again.";
            }
          }
          parts.push('');
          parts.push(error);
        } else if (error) {
          parts.push('');
          parts.push(error);
        }

        if (detail) {
          parts.push(detail);
        }

        detailsEl.textContent = parts.join('\n') || 'Unknown error';
        if (retryLabel) document.getElementById('retry-btn').textContent = retryLabel;
      }

      displayError();

      if (continueUrl) {
        const continueBtn = document.getElementById('continue-btn');
        continueBtn.hidden = false;
        continueBtn.onclick = () => {
          window.location.href = continueUrl;
        };
      }

      document.getElementById('retry-btn').onclick = () => {
        if (retryUrl) {
          window.location.href = retryUrl;
        } else {
          window.location.reload();
        }
      };
    </script>
  </body>
</html>
