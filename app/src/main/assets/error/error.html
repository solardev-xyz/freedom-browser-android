<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:*;"
    />
    <title></title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body:not(.ready) .container {
        visibility: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(ellipse at top left, #1f1f1f 0%, #141414 60%);
        color: #f5f5f5;
        padding: 32px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-sizing: border-box;
      }
      .container {
        max-width: 560px;
        width: 100%;
      }
      h1 {
        font-size: 22px;
        margin: 24px 0 12px 0;
        color: #ff5e5e;
      }
      p {
        line-height: 1.55;
        margin: 0 0 20px 0;
        color: #ccc;
        font-size: 15px;
      }
      .error-details {
        background: #1a1a1a;
        padding: 14px 16px;
        border-radius: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: #ff8a8a;
        margin: 0 0 24px 0;
        word-break: break-all;
        white-space: pre-wrap;
        text-align: left;
      }
      button {
        padding: 12px 22px;
        background: #2c2c2c;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        min-height: 44px;
      }
      button:active {
        background: #3a3a3a;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      /* Not cross-checked (#96): a caution, not a failure. */
      body.warn h1 {
        color: #f0a030;
      }
      body.warn .error-details {
        color: #f5c270;
      }
      #continue-btn {
        background: #8a5a00;
        border-color: #b07400;
      }
      #continue-btn:active {
        background: #a06a00;
      }
      .nodes-icon {
        display: inline-block;
        width: 1.2em;
        height: 1.2em;
        vertical-align: middle;
        margin: 0 2px;
      }

      @media (prefers-color-scheme: light) {
        body {
          background: radial-gradient(ellipse at top left, #f6f8fa 0%, #ffffff 60%);
          color: #24292f;
        }
        h1 {
          color: #cf222e;
        }
        p {
          color: #57606a;
        }
        .error-details {
          background: #f6f8fa;
          color: #cf222e;
        }
        button {
          background: #f6f8fa;
          border-color: #d0d7de;
          color: #24292f;
        }
        button:active {
          background: #e8eaed;
        }
        body.warn h1 {
          color: #9a6700;
        }
        body.warn .error-details {
          color: #7d4e00;
        }
        #continue-btn {
          background: #9a6700;
          border-color: #7d4e00;
          color: #fff;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="title"></h1>
      <p id="description"></p>
      <div id="details" class="error-details"></div>
      <div class="buttons">
        <button id="continue-btn" hidden></button>
        <button id="retry-btn"></button>
      </div>
    </div>

    <script>
      // The page's text, in the app's language (#280). The app can't
      // serve this asset itself (WebView doesn't ask the interceptor for
      // file:///android_asset/), so it hands the page its string table
      // once the page has committed: evaluateJavascript calls
      // window.__errorPageStrings(table) (ErrorPage.stringsScript). Keys
      // are the `errorpage_` resources' names without that prefix.
      // Nothing shows until then, so no half-English page flashes; if it
      // never comes, the page shows in English (FALLBACK, below).
      let S = {};

      // The string [key] with its `%1$s`-style arguments filled in.
      function fmt(key, ...args) {
        return (S[key] || '').replace(/%(\d+)\$s|%%/g, (m, n) => (n ? String(args[n - 1]) : '%'));
      }

      // [fmt] as a list of text pieces and [args] as they are (a node
      // stays a node), for `append`: nothing becomes HTML.
      function fmtNodes(key, ...args) {
        const text = S[key] || '';
        const out = [];
        const re = /%(\d+)\$s|%%/g;
        let last = 0;
        let m;
        while ((m = re.exec(text))) {
          out.push(text.slice(last, m.index), m[1] ? args[m[1] - 1] : '%');
          last = re.lastIndex;
        }
        out.push(text.slice(last));
        return out;
      }

      const NODES_ICON =
        '<svg class="nodes-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><style>.net-line{stroke:currentColor;stroke-width:8;stroke-linecap:round}.net-node{fill:none;stroke:currentColor;stroke-width:8}</style><line x1="44.5" y1="33.5" x2="25.5" y2="66.5" class="net-line"/><line x1="55.5" y1="33.5" x2="74.5" y2="66.5" class="net-line"/><line x1="31" y1="76" x2="69" y2="76" class="net-line"/><circle cx="50" cy="24" r="11" class="net-node"/><circle cx="20" cy="76" r="11" class="net-node"/><circle cx="80" cy="76" r="11" class="net-node"/></svg>';

      function detectProtocol(url) {
        if (!url) return null;
        if (url.match(/^bzz:\/\//i) || url.match(/\/bzz\//i)) return 'swarm';
        if (url.match(/^ipfs:\/\//i) || url.match(/\/ipfs\//i)) return 'ipfs';
        if (url.match(/^ipns:\/\//i) || url.match(/\/ipns\//i)) return 'ipns';
        return null;
      }

      function toProtocolUrl(url) {
        if (!url) return null;
        const bzzMatch = url.match(/\/bzz\/([a-fA-F0-9]{64,128})(\/.*)?/);
        if (bzzMatch) return 'bzz://' + bzzMatch[1] + (bzzMatch[2] || '');
        const ipfsMatch = url.match(/\/ipfs\/([a-zA-Z0-9]+)(\/.*)?/);
        if (ipfsMatch) return 'ipfs://' + ipfsMatch[1] + (ipfsMatch[2] || '');
        const ipnsMatch = url.match(/\/ipns\/([a-zA-Z0-9.-]+)(\/.*)?/);
        if (ipnsMatch) return 'ipns://' + ipnsMatch[1] + (ipnsMatch[2] || '');
        return url;
      }

      // Which name system a name failure belongs to, from the display
      // URL's host (`alice.wei/p`, `bzz://name.gwei`). Mirrors desktop's
      // `nameSystemLabelForName`.
      function nameSystemLabel(url) {
        const host = (url || '')
          .replace(/^[a-z][a-z0-9+.-]*:\/\//i, '')
          .split(/[\/?#]/)[0]
          .toLowerCase();
        if (host.endsWith('.wei')) return 'WNS';
        if (host.endsWith('.gwei')) return 'GNS';
        if (host.endsWith('.tez')) return 'Tezos Domains';
        return 'ENS';
      }

      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      const url = params.get('url');
      const explicitProtocol = params.get('protocol');
      const retryUrl = params.get('retry') || url;
      const detail = params.get('detail');
      const continueUrl = params.get('continue');
      const resolved = params.get('resolved');
      // What the Try Again button says; a page can name its way on.
      let retryLabel = null;
      const NETWORKS = { bzz: 'Swarm', ipfs: 'IPFS', ipns: 'IPNS' };

      function schemeOf(u) {
        const m = (u || '').match(/^([a-z][a-z0-9+.-]*):\/\//i);
        return m ? m[1].toLowerCase() : null;
      }
      const protocolUrl = toProtocolUrl(url);
      const protocol = explicitProtocol || detectProtocol(url);

      const detailsEl = document.getElementById('details');
      const descriptionEl = document.getElementById('description');
      const titleEl = document.getElementById('title');
      const nameLabel = nameSystemLabel(url);
      // Whose RPC servers answer for it: Tezos Domains isn't on Ethereum.
      const chainLabel = nameLabel === 'Tezos Domains' ? 'Tezos' : 'Ethereum';

      async function checkSwarmStatus() {
        try {
          // no-cors: this page's origin is `null`, and the gateway allows
          // no CORS origins (#284), so a CORS fetch could never read the
          // answer. An opaque answer only proves *something* answered HTTP
          // on :1633 — its status is hidden, so a 5xx, or another app bound
          // to the port, also reads as running. That's fine for ant, whose
          // /health always answers 200 once the gateway listens; a gateway
          // that isn't listening rejects the fetch.
          await fetch('http://127.0.0.1:1633/health', { mode: 'no-cors', cache: 'no-store' });
          return { running: true };
        } catch (e) {
          return { running: false };
        }
      }

      // The address (and the resolver's detail line) as the page prints
      // it: every bidi control shown as U+FFFD, as the address bar does
      // (BidiControls.kt, the same Bidi_Control list).
      // A name ENSIP-15 refuses reaches this page as given, and one RLO
      // in it (`ens://%E2%80%AEmoc.lapyap.eth`) printed `hte.paypal.com`.
      function shown(text) {
        return text.replace(/\p{Bidi_Control}/gu, '\uFFFD');
      }

      async function displayError() {
        const parts = [];
        if (protocolUrl) parts.push(shown(protocolUrl));
        else if (url) parts.push(shown(url));

        if (error === 'ens_not_found') {
          titleEl.textContent = fmt('ens_not_found_title', nameLabel);
          // ENS goes through a per-name resolver; WNS/GNS store records
          // straight on their registry, so there the other cause is the
          // name not being registered. Tezos Domains publishes a website
          // record rather than a contenthash, and names expire.
          descriptionEl.innerHTML =
            nameLabel === 'Tezos Domains'
              ? fmt('page_ens_not_found_tezos')
              : nameLabel === 'ENS'
                ? fmt('page_ens_not_found_no_resolver', nameLabel)
                : fmt('page_ens_not_found_unregistered', nameLabel);
        } else if (error === 'ens_wrong_protocol') {
          // #97: a typed scheme is an assertion, never silently switched.
          titleEl.textContent = fmt('ens_wrong_protocol_title');
          const asserted = schemeOf(url);
          if (resolved && asserted && NETWORKS[resolved] && NETWORKS[asserted]) {
            descriptionEl.textContent = fmt(
              'page_wrong_protocol_networks',
              nameLabel,
              NETWORKS[resolved],
              NETWORKS[asserted],
              asserted
            );
            retryLabel = fmt('page_open_on_network', NETWORKS[resolved]);
          } else {
            descriptionEl.innerHTML =
              nameLabel === 'Tezos Domains'
                ? fmt('page_wrong_protocol_website_record', nameLabel)
                : fmt('page_wrong_protocol_contenthash', nameLabel);
          }
        } else if (error === 'ens_unsupported_codec') {
          titleEl.textContent = fmt('unsupported_format_title');
          descriptionEl.innerHTML = fmt('page_unsupported_codec', nameLabel);
        } else if (error === 'ens_invalid_name') {
          titleEl.textContent = fmt('ens_invalid_name_title', nameLabel);
          descriptionEl.innerHTML = fmt('ens_invalid_name_description', nameLabel);
        } else if (error === 'ens_name_too_long') {
          titleEl.textContent = fmt('ens_name_too_long_title', nameLabel);
          descriptionEl.innerHTML = fmt('ens_name_too_long_description', nameLabel);
        } else if (error === 'ens_unverified') {
          // #96: only one RPC server's word for where the name leads.
          document.body.classList.add('warn');
          titleEl.textContent = fmt('not_cross_checked_title');
          descriptionEl.innerHTML = fmt('page_ens_unverified', chainLabel, nameLabel);
        } else if (error === 'ens_conflict') {
          // #96: the servers asked gave different answers.
          titleEl.textContent = fmt('rpc_disagreed_title');
          descriptionEl.innerHTML = fmt('page_ens_conflict', chainLabel, nameLabel);
        } else if (error === 'ens_lookup_failed') {
          titleEl.textContent = fmt('lookup_failed_title', nameLabel);
          if (detail === 'CCIP_DISABLED') {
            descriptionEl.innerHTML = fmt('ccip_disabled_description');
          } else if (nameLabel === 'Tezos Domains') {
            descriptionEl.innerHTML = fmt('tezos_rpc_unreachable_description');
          } else {
            descriptionEl.innerHTML = fmt('ethereum_rpc_unreachable_description');
          }
        } else if (error === 'web3_unverified') {
          // #123: an onchain app's code only one RPC server returned.
          document.body.classList.add('warn');
          titleEl.textContent = fmt('not_cross_checked_title');
          descriptionEl.innerHTML = fmt('page_web3_unverified');
        } else if (error === 'web3_conflict') {
          titleEl.textContent = fmt('rpc_disagreed_title');
          descriptionEl.innerHTML = fmt('page_web3_conflict');
        } else if (error === 'web3_unknown_chain') {
          titleEl.textContent = fmt('page_web3_unknown_chain_title');
          descriptionEl.innerHTML = fmt('page_web3_unknown_chain');
        } else if (error === 'web3_not_an_app') {
          titleEl.textContent = fmt('page_web3_not_an_app_title');
          descriptionEl.innerHTML = fmt('page_web3_not_an_app');
        } else if (error === 'web3_too_large') {
          titleEl.textContent = fmt('page_web3_too_large_title');
          descriptionEl.innerHTML = fmt('page_web3_too_large');
        } else if (error === 'web3_invalid') {
          titleEl.textContent = fmt('page_web3_invalid_title');
          descriptionEl.innerHTML = fmt('page_web3_invalid');
        } else if (error === 'web3_lookup_failed') {
          titleEl.textContent = fmt('page_web3_lookup_failed_title');
          descriptionEl.innerHTML = fmt('page_web3_lookup_failed');
        } else if (error && error.indexOf('cert_') === 0) {
          // #259: an https site whose certificate failed. Always refused
          // (no proceed-anyway); the host is the page's word, so it goes
          // in as text, never as HTML.
          const CERT_DESCRIPTIONS = {
            cert_expired: (b) => fmtNodes('cert_description_expired', b),
            cert_not_yet_valid: (b) => fmtNodes('cert_description_not_yet_valid', b),
            cert_date_invalid: (b) => fmtNodes('cert_description_date_invalid', b),
            cert_wrong_host: (b) => fmtNodes('cert_description_wrong_host', b),
            cert_untrusted: (b) => fmtNodes('cert_description_untrusted', b),
          };
          const describe =
            CERT_DESCRIPTIONS[error] || ((b) => fmtNodes('cert_description_invalid', b));
          const host =
            shown((url || '').replace(/^[a-z][a-z0-9+.-]*:\/\//i, '').split(/[\/?#]/)[0] || url || '');
          titleEl.textContent = fmt('cert_title');
          descriptionEl.textContent = '';
          descriptionEl.append(
            ...describe(Object.assign(document.createElement('b'), { textContent: host })),
            ' ' + fmt('cert_description_risk')
          );
          document.title = fmt('cert_title');
          if (detail) parts.push('');
        } else if (error === 'swarm_content_not_found') {
          titleEl.textContent = fmt('page_swarm_not_ready_title');
          descriptionEl.innerHTML = fmt('page_swarm_not_ready');
          if (protocolUrl) {
            parts.push('');
            parts.push(fmt('page_swarm_not_found_detail'));
          }
        } else if (error && error.indexOf('ERR_CONNECTION_REFUSED') !== -1) {
          if (protocol === 'swarm') {
            const status = await checkSwarmStatus();
            if (!status.running) {
              descriptionEl.innerHTML = fmt('page_swarm_node_stopped', NODES_ICON);
            } else {
              descriptionEl.innerHTML = fmt('page_swarm_gateway_unreachable');
            }
          }
          parts.push('');
          parts.push(error);
        } else if (error) {
          parts.push('');
          parts.push(error);
        }

        if (detail) {
          parts.push(shown(detail));
        }

        detailsEl.textContent = parts.join('\n') || fmt('page_unknown_error');
        if (retryLabel) document.getElementById('retry-btn').textContent = retryLabel;
      }

      // The English text, in case the app's table never comes: the page
      // is never left blank without a Retry. Kept equal to the English
      // resources by ErrorPageStringsTest; the app's table, in the app's
      // language, replaces it whenever it arrives.
      const FALLBACK = /* EN-FALLBACK */{"page_default_title":"Content Unavailable","page_default_description":"This content could not be retrieved from the decentralized network. The address may be invalid, the content may no longer exist, or no peers are serving it.","page_continue_once":"Continue once","page_try_again":"Try Again","ens_not_found_title":"No content for this %1$s name","page_ens_not_found_tezos":"This Tezos Domains name doesn't point at a website. The owner may not have set a \u003ccode\u003eweb:content_url\u003c/code\u003e record, the name isn't registered, or it has expired.","page_ens_not_found_no_resolver":"This %1$s name doesn't point at any content yet. The owner may not have set a \u003ccode\u003econtenthash\u003c/code\u003e record, or the name has no resolver.","page_ens_not_found_unregistered":"This %1$s name doesn't point at any content yet. The owner may not have set a \u003ccode\u003econtenthash\u003c/code\u003e record, or the name isn't registered.","ens_wrong_protocol_title":"Name lives on a different network","page_wrong_protocol_networks":"This %1$s name resolves to %2$s content, not %3$s. The %4$s:// you typed asks for %3$s only, so Freedom did not switch networks for you.","page_open_on_network":"Open on %1$s","page_wrong_protocol_contenthash":"This %1$s name resolves to content on a different network than the scheme you typed asks for. Try the name on its own \u0026mdash; the browser will follow wherever its \u003ccode\u003econtenthash\u003c/code\u003e points.","page_wrong_protocol_website_record":"This %1$s name resolves to content on a different network than the scheme you typed asks for. Try the name on its own \u0026mdash; the browser will follow wherever its website record points.","unsupported_format_title":"Unsupported content format","page_unsupported_codec":"This %1$s name resolves to a content format Freedom Browser cannot load yet on mobile.","ens_invalid_name_title":"Not a valid %1$s name","ens_invalid_name_description":"This name breaks the ENSIP-15 naming rules (a disallowed character, mixed scripts, a lookalike, \u0026hellip;), so Freedom Browser won't look it up \u0026mdash; other %1$s apps refuse it too, and it could be mistaken for a different name. Check the spelling.","ens_name_too_long_title":"%1$s name too long","ens_name_too_long_description":"A label of this name is longer than the 255 bytes an %1$s lookup can carry, so Freedom Browser can't ask a resolver about it. Check the address.","not_cross_checked_title":"Not cross-checked","page_ens_unverified":"Only one %1$s RPC server answered for this %2$s name, so Freedom couldn't check its answer against another server. The address below may be right, but a single misbehaving server could have picked it.","rpc_disagreed_title":"RPC servers disagreed","page_ens_conflict":"The %1$s RPC servers Freedom asked gave different answers for this %2$s name. At least one of them is wrong \u0026mdash; or lying \u0026mdash; so nothing was loaded. Try again in a moment.","lookup_failed_title":"%1$s lookup failed","ccip_disabled_description":"This name is resolved through an off-chain gateway (CCIP-Read), which is turned off in Settings \u0026rarr; Name resolution.","tezos_rpc_unreachable_description":"Couldn't reach a Tezos RPC endpoint to resolve this name. Check your connection and try again.","ethereum_rpc_unreachable_description":"Couldn't reach an Ethereum RPC endpoint to resolve this name. Check your connection, or the endpoints in Settings \u0026rarr; Name resolution \u0026rarr; RPC providers, and try again.","page_web3_unverified":"Only one RPC server returned this onchain app's code, so Freedom couldn't check it against another server. It may be the real app, but a single misbehaving server could have changed it. Continue only if you trust that server with this app.","page_web3_conflict":"The RPC servers Freedom asked returned different code for this onchain app. At least one of them is wrong \u0026mdash; or lying \u0026mdash; so nothing was run. Try again in a moment.","page_web3_unknown_chain_title":"Unknown chain","page_web3_unknown_chain":"This app lives on a chain that isn't in your chain list, so Freedom doesn't know which RPC servers to ask. Add the chain in Settings, then try again.","page_web3_not_an_app_title":"Not an onchain app","page_web3_not_an_app":"The contract didn't return an ERC-8244 \u003ccode\u003ehtml()\u003c/code\u003e document on this chain. Check the address and the chain ID.","page_web3_too_large_title":"App too large","page_web3_too_large":"The app's document is larger than Freedom loads.","page_web3_invalid_title":"Not a web3:// app address","page_web3_invalid":"Freedom loads web3:// apps by contract address: \u003ccode\u003eweb3://0x\u0026hellip;[:chainId]/\u003c/code\u003e. Names are not supported yet.","page_web3_lookup_failed_title":"Couldn't read the app","page_web3_lookup_failed":"Couldn't get an answer from the chain's RPC servers. Check your connection and try again.","cert_title":"Connection isn't secure","cert_description_expired":"Freedom didn't load %1$s because its security certificate has expired.","cert_description_not_yet_valid":"Freedom didn't load %1$s because its security certificate isn't valid yet. If your device's date and time are wrong, correct them and try again.","cert_description_date_invalid":"Freedom didn't load %1$s because its security certificate has invalid dates.","cert_description_wrong_host":"Freedom didn't load %1$s because its security certificate was issued for a different site.","cert_description_untrusted":"Freedom didn't load %1$s because its security certificate wasn't issued by an authority this device trusts.","cert_description_invalid":"Freedom didn't load %1$s because its security certificate is not valid.","cert_description_risk":"Someone could be impersonating the site or intercepting the connection, or the site is misconfigured.","page_swarm_not_ready_title":"Content not ready yet","page_swarm_not_ready":"Couldn't find this content on the Swarm network yet. The node is still connecting to peers \u0026mdash; try again in a moment.","page_swarm_not_found_detail":"Swarm content not found (timeout)","page_swarm_node_stopped":"The Swarm node is not running. Open the Nodes panel %1$s from the menu to start it.","page_swarm_gateway_unreachable":"Couldn't reach the Swarm gateway. Check that the node is running and try again.","page_unknown_error":"Unknown error"}/* /EN-FALLBACK */;
      const FALLBACK_AFTER_MS = 1500;

      // Run when the app hands over the strings; a table that came before
      // this script ran was parked in window.__errorPageTable. Once the
      // app's own table ran, nothing replaces it.
      let started = false;
      function start(table, fallback) {
        if (started === true || !table || typeof table !== 'object') return;
        if (started && fallback) return;
        started = fallback ? 'fallback' : true;
        S = table;
        document.title = fmt('page_default_title');
        titleEl.textContent = fmt('page_default_title');
        descriptionEl.textContent = fmt('page_default_description');
        document.getElementById('continue-btn').textContent = fmt('page_continue_once');
        document.getElementById('retry-btn').textContent = fmt('page_try_again');
        displayError().finally(() => document.body.classList.add('ready'));
      }
      window.__errorPageStrings = (table) => start(table, false);
      if (window.__errorPageTable) start(window.__errorPageTable, false);
      setTimeout(() => start(FALLBACK, true), FALLBACK_AFTER_MS);

      if (continueUrl) {
        const continueBtn = document.getElementById('continue-btn');
        continueBtn.hidden = false;
        continueBtn.onclick = () => {
          window.location.href = continueUrl;
        };
      }

      document.getElementById('retry-btn').onclick = () => {
        if (retryUrl) {
          window.location.href = retryUrl;
        } else {
          window.location.reload();
        }
      };
    </script>
  </body>
</html>
